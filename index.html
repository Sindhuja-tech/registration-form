<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Eye Icon-kkaaga -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center h-screen m-0">

    <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-slate-800">Create Account</h2>
            <p class="text-sm text-slate-500 mt-1">Fill in your details below</p>
        </div>
        
        <form id="regForm" class="space-y-4">
            <!-- Name Field -->
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Name</label>
                <input type="text" id="name" placeholder="Enter your name" 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm transition-all">
                <small id="nameError" class="text-red-500 text-xs mt-1 block h-4"></small>
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" id="email" placeholder="Enter your email" 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm transition-all">
                <small id="emailError" class="text-red-500 text-xs mt-1 block h-4"></small>
            </div>

            <!-- Password Field with Eye Icon -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="Min 6 chars, Capital, Small, Number, @#$" 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm transition-all pr-10">
                    <button type="button" id="togglePassword" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer">
                        <i class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
                <small id="passwordError" class="text-red-500 text-xs mt-1 block"></small>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" disabled 
                class="w-full py-3 bg-purple-600 text-white font-semibold rounded-lg transition-all duration-300 cursor-pointer shadow-md disabled:bg-slate-300 disabled:shadow-none disabled:cursor-not-allowed hover:enabled:bg-purple-700 hover:enabled:shadow-lg">
                Submit
            </button>
        </form>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
